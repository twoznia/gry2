<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Szybka Reakcja - Samuraj</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #gameCanvas { touch-action: none; background: radial-gradient(circle at 50% 18%, #1f2937 0%, #0b0f17 100%); border-radius: 8px; cursor: crosshair; display: block; }
        body { background-color: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; margin: 0; font-family: 'Inter', sans-serif; }
        .back-link { position: fixed; top: 10px; left: 10px; z-index: 100; background: #334155; color: #fff; border: 1px solid #475569; border-radius: 8px; padding: 8px 14px; text-decoration: none; font-size: 13px; }
        .back-link:hover { background: #475569; }
            /* Mobile: plansza wykorzystuje cały ekran */
        @media (max-width: 768px), (max-height: 500px) {
            body { justify-content: flex-start; }
            body > div.text-center { max-width: 100%; padding-left: 0; padding-right: 0; }
            #game-title { display: none; }
            #hud { height: 40px; padding: 0 10px 0 82px; gap: 8px; margin-bottom: 0; border-radius: 0; font-size: 12px; flex-wrap: nowrap; align-items: center; overflow-x: auto; white-space: nowrap; }
            #gameCanvas { height: calc(100dvh - 40px) !important; border-radius: 0; }
            .back-link { top: 5px; left: 6px; padding: 6px 10px; font-size: 12px; }
        }
    </style>
</head>
<body>
<a class="back-link" href="../">← Wróć</a>

<div class="text-center w-full max-w-6xl px-4">
    <h1 id="game-title" class="text-3xl font-bold mb-4 text-rose-400">⚔️ Samuraj</h1>

    <div id="hud" class="flex flex-wrap justify-between items-center w-full gap-2 md:gap-6 bg-gray-800 p-3 rounded-xl mb-3 shadow-lg border border-gray-700 text-sm md:text-base">
        <div>Etap: <span id="level-display" class="font-bold text-blue-400">1</span>/<span id="max-level-display">4</span></div>
        <div>Punkty: <span id="score-display" class="font-bold text-green-400">0</span></div>
        <div>Czas: <span id="timer-display" class="font-bold text-yellow-400">15</span>s</div>
    </div>

    <div id="game-container" class="relative">
        <canvas id="gameCanvas" class="w-full shadow-2xl" style="height: clamp(300px, calc(100dvh - 240px), 720px)"></canvas>

        <div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/85 rounded-lg p-4 z-10 overflow-y-auto">
            <div id="overlay-content" class="w-full max-w-md text-center">
                <h2 id="overlay-title" class="text-3xl font-bold mb-3 text-white">Wybierz tryb gry!</h2>
                <div id="overlay-stats" class="text-left text-lg text-gray-200 mb-5 bg-gray-800 p-4 rounded-lg hidden"></div>
                <p id="overlay-desc" class="text-yellow-300 mb-5 font-bold text-lg min-h-[2.5rem]"></p>

                <div id="mode-selection" class="flex flex-col sm:flex-row gap-4 w-full justify-center mt-2">
                    <button id="btn-child" class="flex-1 bg-green-600 hover:bg-green-500 p-4 rounded-xl text-xl font-bold transition-all shadow-lg border border-green-400/30 flex flex-col items-center justify-center gap-2">
                        <img src="../pic/kid.jpg" alt="Dziecko" class="w-28 h-28 rounded-full object-cover border-2 border-green-300"> Dziecko
                        <span class="text-sm font-normal text-green-100">3 poziomy · wolniej</span>
                    </button>
                    <button id="btn-adult" class="flex-1 bg-blue-600 hover:bg-blue-500 p-4 rounded-xl text-xl font-bold transition-all shadow-lg border border-blue-400/30 flex flex-col items-center justify-center gap-2">
                        <img src="../pic/adult.jpg" alt="Dorosły" class="w-28 h-28 rounded-full object-cover border-2 border-blue-300"> Dorosły
                        <span class="text-sm font-normal text-blue-100">4 poziomy · fale kulek, trudno</span>
                    </button>
                </div>

                <button id="main-btn" class="hidden bg-blue-600 hover:bg-blue-500 px-8 py-4 rounded-xl text-xl font-bold transition-all shadow-lg border border-blue-400/30 w-full mt-4">
                    Zagraj ponownie
                </button>

                <div id="save-section" class="hidden mt-4 pt-4 border-t border-gray-600 w-full">
                    <p class="text-gray-300 text-sm mb-2">Zapisz wynik do tabeli rekordów:</p>
                    <div class="flex gap-2 mb-1">
                        <input id="player-name-input" type="text" placeholder="Twoje imię" maxlength="20"
                               class="flex-1 bg-gray-700 text-white px-3 py-2 rounded-lg border border-gray-500 focus:outline-none focus:border-blue-400 text-sm">
                        <button id="save-record-btn" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg font-bold text-sm transition-colors">Zapisz</button>
                    </div>
                    <p id="save-info" class="text-green-400 text-xs hidden mb-1">✓ Wynik zapisany!</p>
                    <button id="show-records-end-btn" class="text-blue-400 text-xs underline hover:text-blue-300 mt-1">Pokaż tabelę rekordów →</button>
                </div>

                <button id="show-records-start-btn" class="hidden text-blue-400 text-sm mt-3 underline hover:text-blue-300">Tabela rekordów</button>
            </div>

            <div id="records-view" class="hidden w-full max-w-xl text-center">
                <h2 class="text-2xl font-bold mb-3 text-white">Tabela rekordów</h2>
                <div class="flex gap-2 justify-center mb-2 flex-wrap">
                    <button class="records-mode-tab px-3 py-1 rounded-lg text-sm font-bold transition-colors bg-blue-600 text-white" data-mode="adult">Dorosły</button>
                    <button class="records-mode-tab px-3 py-1 rounded-lg text-sm font-bold transition-colors bg-gray-700 text-gray-300" data-mode="child">Dziecko</button>
                </div>
                <div class="flex items-center gap-2 justify-center mb-2 flex-wrap">
                    <span class="text-gray-400 text-xs">Osoba:</span>
                    <select id="records-player-select" class="bg-gray-700 text-white text-xs px-2 py-1 rounded-lg border border-gray-600 focus:outline-none focus:border-blue-400">
                        <option value="">Wszyscy</option>
                    </select>
                </div>
                <div id="records-level-tabs" class="flex gap-2 justify-center mb-3 flex-wrap"></div>
                <div id="records-table-wrapper" class="text-left bg-gray-800 rounded-lg p-3 overflow-y-auto" style="max-height: 50vh"></div>
                <button id="close-records-btn" class="mt-4 bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-xl font-bold text-sm transition-colors">Zamknij</button>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelDisplayEl = document.getElementById('level-display');
    const maxLevelDisplayEl = document.getElementById('max-level-display');
    const scoreDisplayEl = document.getElementById('score-display');
    const timerEl = document.getElementById('timer-display');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayStats = document.getElementById('overlay-stats');
    const overlayDesc = document.getElementById('overlay-desc');
    const mainBtn = document.getElementById('main-btn');
    const modeSelection = document.getElementById('mode-selection');
    const btnChild = document.getElementById('btn-child');
    const btnAdult = document.getElementById('btn-adult');
    const titleEl = document.getElementById('game-title');
    const overlayContent = document.getElementById('overlay-content');
    const saveSection = document.getElementById('save-section');
    const playerNameInput = document.getElementById('player-name-input');
    const saveRecordBtn = document.getElementById('save-record-btn');
    const saveInfo = document.getElementById('save-info');
    const showRecordsEndBtn = document.getElementById('show-records-end-btn');
    const showRecordsStartBtn = document.getElementById('show-records-start-btn');
    const recordsView = document.getElementById('records-view');
    const recordsLevelTabs = document.getElementById('records-level-tabs');
    const recordsTableWrapper = document.getElementById('records-table-wrapper');
    const closeRecordsBtn = document.getElementById('close-records-btn');
    const recordsPlayerSelect = document.getElementById('records-player-select');

    const FRUIT_COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#a855f7','#ec4899'];
    const LEVEL_TIME = 15;            // seconds per level
    const BONUS_TIME = 3;             // seconds for the bonus round

    // speed is px/frame at a 600px reference height; scaled to real canvas height
    // burst = how many balls appear in a single spawn (spread across columns and
    // staggered in time), so a straight swipe can't clear them all.
    const LEVEL_CONFIG = {
        // arcChance: szansa, że kulka wyleci łukiem z dołu (jak w Fruit Ninja)
        child: [
            { spawnMs: 850, speed: 2.0, bombChance: 0.08, burst: 1, arcChance: 0 },
            { spawnMs: 700, speed: 2.6, bombChance: 0.10, burst: 1, arcChance: 0 },
            { spawnMs: 580, speed: 3.2, bombChance: 0.12, burst: 1, arcChance: 0.25 },
        ],
        adult: [
            { spawnMs: 620, speed: 3.8, bombChance: 0.10, burst: 2, arcChance: 0 },
            { spawnMs: 540, speed: 4.5, bombChance: 0.13, burst: 2, arcChance: 0.25 },
            { spawnMs: 470, speed: 5.2, bombChance: 0.16, burst: 3, arcChance: 0.35 },
            { spawnMs: 400, speed: 6.0, bombChance: 0.20, burst: 3, arcChance: 0.45 },
        ],
    };

    // ─── State ─────────────────────────────────────────────────────────────────────
    let gameMode = 'adult', maxLevels = 4, currentLevel = 1;
    let score = 0, timeLeft = LEVEL_TIME;
    let phase = 'menu';   // menu | playing | bonus | end
    let fruits = [], particles = [], floats = [];
    let nextId = 0;
    let spawnTimer = 0, lastTime = 0;
    let countdownInterval = null, animFrameId = null, phaseTimeout = null;

    // bonus round
    let bigBall = null, bonusCombo = 0, lastBonusSlice = 0;
    let bonusActiveAt = 0;          // kulkę premiową można ciąć dopiero po tym czasie (1 s opóźnienia)

    // blade / stroke
    let stroking = false;
    let blade = [];                 // {x,y,t}
    let strokeSliced = new Set();   // ids sliced in the current stroke
    let strokeFruitCount = 0;       // combo length — resets on direction change
    let comboDirX = 0, comboDirY = 0; // current swipe direction signs
    let flashUntil = 0;             // red flash (bomb) timestamp

    // ─── Records ───────────────────────────────────────────────────────────────────
    // ─── Rekordy (leaderboard jak w grze unik) ──────────────────────────────────────
    const RECORDS_KEY = 'reflexSamurajRecords';
    const NAME_KEY    = 'reflexLastName';
    const MAX_PER_PLAYER = 10;
    let results = {}, scoreAtLevelStart = 0, recordsSaved = false;

    function normalizeName(n) { return n.trim().toLowerCase(); }
    function loadRecords() { try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || {}; } catch { return {}; } }
    function saveRecordsToStorage(r) { localStorage.setItem(RECORDS_KEY, JSON.stringify(r)); }

    function addRecord(mode, levelKey, name, scoreVal) {
        const records = loadRecords();
        if (!records[mode]) records[mode] = {};
        if (!records[mode][levelKey]) records[mode][levelKey] = [];
        records[mode][levelKey].push({ name: name.trim(), score: scoreVal, date: new Date().toLocaleDateString('pl-PL') });
        records[mode][levelKey].sort((a, b) => b.score - a.score);
        const seen = {};
        records[mode][levelKey] = records[mode][levelKey].filter(r => {
            const key = normalizeName(r.name);
            seen[key] = (seen[key] || 0) + 1;
            return seen[key] <= MAX_PER_PLAYER;
        });
        saveRecordsToStorage(records);
    }

    function savePlayerRecord(name) {
        if (!name.trim()) return;
        localStorage.setItem(NAME_KEY, name.trim());
        let total = 0;
        for (let lvl = 1; lvl <= maxLevels; lvl++) {
            if (results[lvl] !== undefined) { addRecord(gameMode, `level${lvl}`, name, results[lvl]); total += results[lvl]; }
        }
        addRecord(gameMode, 'total', name, total);
    }

    function bestTotal(mode) {
        const r = loadRecords();
        const l = (r[mode] && r[mode]['total']) || [];
        return l.length ? l[0].score : 0;
    }

    // ─── Widok tabeli rekordów ──────────────────────────────────────────────────────
    let recordsViewMode = 'adult', recordsViewLevel = 'total', recordsViewPlayer = '', recordsReturnFn = null;

    function renderRecordsTable(mode, levelKey, filterPlayer) {
        const records = loadRecords();
        let data = (records[mode] && records[mode][levelKey]) || [];
        if (filterPlayer) { const norm = normalizeName(filterPlayer); data = data.filter(r => normalizeName(r.name) === norm); }
        if (!data.length) return '<p class="text-gray-400 text-sm py-4 text-center">Brak rekordów</p>';
        const medals = ['🥇', '🥈', '🥉'];
        let html = '<table class="w-full text-sm border-collapse"><thead><tr class="text-gray-400 text-xs uppercase">';
        html += '<th class="py-1 px-2 text-left">#</th><th class="py-1 px-2 text-left">Imię</th>';
        html += '<th class="py-1 px-2 text-right">Punkty</th><th class="py-1 px-2 text-right">Data</th></tr></thead><tbody>';
        data.forEach((r, i) => {
            const cls = i === 0 ? 'text-yellow-300' : i === 1 ? 'text-gray-300' : i === 2 ? 'text-orange-400' : 'text-white';
            html += `<tr class="${cls} border-t border-gray-700/50">`;
            html += `<td class="py-1 px-2">${medals[i] || (i+1)+'.'}</td>`;
            html += `<td class="py-1 px-2">${r.name}</td>`;
            html += `<td class="py-1 px-2 text-right font-mono text-green-400">${r.score}</td>`;
            html += `<td class="py-1 px-2 text-right text-gray-400 text-xs">${r.date}</td></tr>`;
        });
        html += '</tbody></table>';
        return html;
    }

    function getAllPlayersForMode(mode) {
        const records = loadRecords();
        const modeData = records[mode] || {};
        const nameMap = new Map();
        for (const levelData of Object.values(modeData)) {
            for (const r of levelData) { const key = normalizeName(r.name); if (!nameMap.has(key)) nameMap.set(key, r.name); }
        }
        return [...nameMap.values()].sort((a, b) => a.localeCompare(b, 'pl'));
    }

    function buildPlayerFilter(mode) {
        const players = getAllPlayersForMode(mode);
        recordsPlayerSelect.innerHTML = '<option value="">Wszyscy</option>' +
            players.map(p => `<option value="${p}" ${normalizeName(p) === normalizeName(recordsViewPlayer) ? 'selected' : ''}>${p}</option>`).join('');
    }

    function buildRecordsLevelTabs(mode) {
        const n = LEVEL_CONFIG[mode].length;
        const levels = [];
        for (let i = 1; i <= n; i++) levels.push([`level${i}`, `Poziom ${i}`]);
        levels.push(['total', 'Łącznie']);
        recordsLevelTabs.innerHTML = levels.map(([key, label]) =>
            `<button class="records-level-tab px-3 py-1 rounded-lg text-xs font-bold transition-colors ${recordsViewLevel === key ? 'bg-green-600 text-white' : 'bg-gray-700 text-gray-300'}" data-level="${key}">${label}</button>`
        ).join('');
        recordsLevelTabs.querySelectorAll('.records-level-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                recordsViewLevel = btn.dataset.level;
                buildRecordsLevelTabs(recordsViewMode);
                recordsTableWrapper.innerHTML = renderRecordsTable(recordsViewMode, recordsViewLevel, recordsViewPlayer);
            });
        });
    }

    function showRecordsView(returnFn, preferMode, preferPlayer) {
        recordsReturnFn = returnFn;
        recordsViewMode = preferMode || gameMode || 'adult';
        recordsViewLevel = 'total';
        recordsViewPlayer = preferPlayer || '';
        overlayContent.classList.add('hidden');
        recordsView.classList.remove('hidden');
        document.querySelectorAll('.records-mode-tab').forEach(btn => {
            btn.classList.toggle('bg-blue-600', btn.dataset.mode === recordsViewMode);
            btn.classList.toggle('text-white', btn.dataset.mode === recordsViewMode);
            btn.classList.toggle('bg-gray-700', btn.dataset.mode !== recordsViewMode);
            btn.classList.toggle('text-gray-300', btn.dataset.mode !== recordsViewMode);
        });
        buildPlayerFilter(recordsViewMode);
        buildRecordsLevelTabs(recordsViewMode);
        recordsTableWrapper.innerHTML = renderRecordsTable(recordsViewMode, recordsViewLevel, recordsViewPlayer);
    }

    document.querySelectorAll('.records-mode-tab').forEach(btn => {
        btn.addEventListener('click', () => { recordsViewMode = btn.dataset.mode; recordsViewPlayer = ''; showRecordsView(recordsReturnFn, recordsViewMode); });
    });
    recordsPlayerSelect.addEventListener('change', () => {
        recordsViewPlayer = recordsPlayerSelect.value;
        buildRecordsLevelTabs(recordsViewMode);
        recordsTableWrapper.innerHTML = renderRecordsTable(recordsViewMode, recordsViewLevel, recordsViewPlayer);
    });
    closeRecordsBtn.addEventListener('click', () => {
        recordsView.classList.add('hidden');
        overlayContent.classList.remove('hidden');
        if (recordsReturnFn) recordsReturnFn();
    });
    saveRecordBtn.addEventListener('click', () => {
        if (recordsSaved) return;
        const name = playerNameInput.value.trim();
        if (!name) { playerNameInput.focus(); return; }
        savePlayerRecord(name);
        recordsSaved = true;
        saveRecordBtn.disabled = true;
        saveRecordBtn.classList.replace('bg-green-600', 'bg-gray-600');
        saveInfo.classList.remove('hidden');
        showRecordsView(() => {}, gameMode, name);
    });
    playerNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveRecordBtn.click(); });
    showRecordsEndBtn.addEventListener('click', () => showRecordsView(() => {}));
    showRecordsStartBtn.addEventListener('click', () => showRecordsView(() => {}));

    // ─── Canvas ──────────────────────────────────────────────────────────────────────
    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function heightScale() { return canvas.height / 600; }
    function fruitRadius() { return Math.max(26, Math.min(canvas.width, canvas.height) * 0.07); }

    function pointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const src = e.touches ? e.touches[0] : e;
        return {
            x: (src.clientX - rect.left) * (canvas.width / rect.width),
            y: (src.clientY - rect.top) * (canvas.height / rect.height),
        };
    }

    // distance from point P to segment AB
    function distToSeg(px, py, ax, ay, bx, by) {
        const dx = bx - ax, dy = by - ay;
        const len2 = dx*dx + dy*dy;
        let t = len2 ? ((px-ax)*dx + (py-ay)*dy) / len2 : 0;
        t = Math.max(0, Math.min(1, t));
        const cx = ax + t*dx, cy = ay + t*dy;
        return Math.hypot(px-cx, py-cy);
    }

    // ─── Spawning ──────────────────────────────────────────────────────────────────
    function spawnOne(cfg, x) {
        const r = fruitRadius();
        const isBomb = Math.random() < cfg.bombChance;
        const common = {
            id: nextId++, x, r,
            color: FRUIT_COLORS[Math.floor(Math.random()*FRUIT_COLORS.length)],
            bomb: isBomb,
        };
        if (Math.random() < (cfg.arcChance || 0)) {
            // wyrzut łukiem z dołu (jak w Fruit Ninja): start pod dolną krawędzią,
            // prędkość w górę + grawitacja; szczyt łuku na ~55–85% wysokości canvasa
            const g = 0.10 * heightScale();
            const peak = canvas.height * (0.55 + Math.random()*0.3);
            fruits.push({
                ...common,
                y: canvas.height + r,
                vy: -Math.sqrt(2 * g * peak),
                vx: (canvas.width/2 - x) / canvas.width * 3 + (Math.random()-0.5) * 1.2,
                g,
            });
        } else {
            fruits.push({
                // stagger the vertical start so balls in one burst arrive at different
                // times — you can't wipe the whole wave with a single straight swipe.
                ...common,
                y: -r - Math.random()*r*3,
                vy: cfg.speed * heightScale() * (0.85 + Math.random()*0.3),
                vx: (Math.random()-0.5) * 0.9,
                g: 0,
            });
        }
    }

    function spawnFruit() {
        const cfg = LEVEL_CONFIG[gameMode][currentLevel - 1];
        const burst = cfg.burst || 1;
        const r = fruitRadius();
        const seg = (canvas.width - r*2) / burst;   // spread the burst across columns
        for (let i = 0; i < burst; i++) {
            spawnOne(cfg, r + seg * (i + Math.random()));
        }
    }

    function addFloat(x, y, text, color) {
        floats.push({ x, y, text, color, life: 1 });
    }

    function burst(x, y, color, n) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 2 + Math.random() * 5;
            particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2, r: 3 + Math.random()*4, color, life: 1 });
        }
    }

    // ─── Slicing ───────────────────────────────────────────────────────────────────
    function sliceCheck(ax, ay, bx, by) {
        if (phase === 'playing') {
            // Combo resets when the swipe reverses direction (left<->right or up<->down).
            const sdx = bx - ax, sdy = by - ay, MIN = 4;
            if (Math.abs(sdx) > MIN) { const s = Math.sign(sdx); if (comboDirX !== 0 && s !== comboDirX) strokeFruitCount = 0; comboDirX = s; }
            if (Math.abs(sdy) > MIN) { const s = Math.sign(sdy); if (comboDirY !== 0 && s !== comboDirY) strokeFruitCount = 0; comboDirY = s; }
            for (const f of fruits) {
                if (strokeSliced.has(f.id)) continue;
                if (distToSeg(f.x, f.y, ax, ay, bx, by) <= f.r) {
                    strokeSliced.add(f.id);
                    f.dead = true;
                    burst(f.x, f.y, f.bomb ? '#94a3b8' : f.color, f.bomb ? 18 : 9);
                    if (f.bomb) {
                        timeLeft = Math.max(0, timeLeft - 3);
                        timerEl.textContent = Math.ceil(timeLeft);
                        flashUntil = performance.now() + 350;
                        addFloat(f.x, f.y, '-3s 💣', '#f87171');
                    } else {
                        strokeFruitCount++;
                        const pts = 5 * strokeFruitCount + 5;   // 10, 15, 20, 25 ... within one combo
                        score += pts;
                        scoreDisplayEl.textContent = score;
                        addFloat(f.x, f.y, '+' + pts + (strokeFruitCount >= 2 ? ' COMBO!' : ''), strokeFruitCount >= 2 ? '#fbbf24' : '#86efac');
                    }
                }
            }
            fruits = fruits.filter(f => !f.dead);
        } else if (phase === 'bonus' && bigBall) {
            const now = performance.now();
            if (now < bonusActiveAt) return;               // kulka jeszcze nieaktywna (1 s gotowości)
            if (now - lastBonusSlice < 120) return;
            if (distToSeg(bigBall.x, bigBall.y, ax, ay, bx, by) <= bigBall.r) {
                lastBonusSlice = now;
                bonusCombo++;
                score += bonusCombo;                       // 1, 2, 3, 4 ...
                scoreDisplayEl.textContent = score;
                addFloat(bigBall.x + (Math.random()-0.5)*bigBall.r, bigBall.y + (Math.random()-0.5)*bigBall.r, '+' + bonusCombo, '#fbbf24');
                burst(ax, ay, '#fbbf24', 8);
                bigBall.pop = 1;
            }
        }
    }

    function onDown(e) {
        if (phase !== 'playing' && phase !== 'bonus') return;
        e.preventDefault();
        stroking = true;
        strokeSliced = new Set();
        strokeFruitCount = 0;
        comboDirX = 0; comboDirY = 0;
        blade = [];
        const p = pointerPos(e);
        blade.push({ x: p.x, y: p.y, t: performance.now() });
    }
    function onMove(e) {
        if (!stroking) return;
        e.preventDefault();
        const p = pointerPos(e);
        const last = blade[blade.length - 1];
        if (last) sliceCheck(last.x, last.y, p.x, p.y);
        blade.push({ x: p.x, y: p.y, t: performance.now() });
        if (blade.length > 14) blade.shift();
    }
    function onUp() { stroking = false; }

    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);

    // ─── Drawing ───────────────────────────────────────────────────────────────────
    function drawFruit(f) {
        if (f.bomb) {
            ctx.fillStyle = '#1f2937';
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 3; ctx.stroke();
            ctx.font = `${Math.round(f.r*1.2)}px serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('💣', f.x, f.y + 1);
            return;
        }
        const g = ctx.createRadialGradient(f.x - f.r*0.3, f.y - f.r*0.3, f.r*0.2, f.x, f.y, f.r);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.25, f.color);
        g.addColorStop(1, f.color);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2; ctx.stroke();
        // little leaf
        ctx.fillStyle = '#16a34a';
        ctx.beginPath(); ctx.ellipse(f.x + f.r*0.35, f.y - f.r*0.85, f.r*0.28, f.r*0.14, -0.6, 0, Math.PI*2); ctx.fill();
    }

    function drawBlade() {
        if (blade.length < 2) return;
        const now = performance.now();
        for (let i = 1; i < blade.length; i++) {
            const a = blade[i-1], b = blade[i];
            const age = (now - b.t) / 160;
            const alpha = Math.max(0, 1 - age);
            ctx.strokeStyle = `rgba(255,255,255,${alpha*0.9})`;
            ctx.lineWidth = (i / blade.length) * 9 + 1;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
    }

    function draw(ts) {
        const dt = Math.min((ts - lastTime) / 16.67, 3);
        lastTime = ts;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // red flash on bomb
        if (performance.now() < flashUntil) {
            ctx.fillStyle = 'rgba(239,68,68,0.18)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        if (phase === 'playing') {
            // ostrzeżenie o końcu czasu: w ostatnich 3 sekundach plansza szarzeje
            if (timeLeft <= 3) {
                ctx.fillStyle = `rgba(148,163,184,${0.2 + (3 - timeLeft) * 0.1})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            for (const f of fruits) { f.vy += (f.g || 0) * dt; f.y += f.vy * dt; f.x += f.vx * dt; }
            // kara za przepuszczoną zwykłą kulkę: -2 pkt + przerwanie serii (bomby wolno przepuszczać)
            for (const f of fruits) {
                if (f.y - f.r >= canvas.height + 40 && !f.bomb && f.vy > 0) {
                    score = Math.max(0, score - 2);
                    scoreDisplayEl.textContent = score;
                    strokeFruitCount = 0;
                    addFloat(Math.min(Math.max(f.x, 30), canvas.width - 30), canvas.height - 20, 'MISS -2', '#f87171');
                }
            }
            fruits = fruits.filter(f => f.y - f.r < canvas.height + 40);
            for (const f of fruits) drawFruit(f);
        } else if (phase === 'bonus' && bigBall) {
            const armed = performance.now() >= bonusActiveAt;   // czy kulkę można już ciąć
            if (bigBall.pop > 0) bigBall.pop = Math.max(0, bigBall.pop - 0.08*dt);
            const scl = 1 + bigBall.pop * 0.12;
            ctx.globalAlpha = armed ? 1 : 0.45;                 // przygaś przed aktywacją
            const g = ctx.createRadialGradient(bigBall.x - bigBall.r*0.3, bigBall.y - bigBall.r*0.3, bigBall.r*0.2, bigBall.x, bigBall.y, bigBall.r*scl);
            g.addColorStop(0, '#fff7cc'); g.addColorStop(0.3, '#facc15'); g.addColorStop(1, '#f59e0b');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(bigBall.x, bigBall.y, bigBall.r*scl, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 4; ctx.stroke();
            ctx.fillStyle = '#7c2d12'; ctx.font = `bold ${Math.round(bigBall.r*0.5)}px Inter, sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(armed ? 'TNIJ!' : 'GOTUJ SIĘ', bigBall.x, bigBall.y);
            ctx.globalAlpha = 1;
        }

        // particles
        for (const p of particles) {
            p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.25 * dt; p.life -= 0.03 * dt;
        }
        particles = particles.filter(p => p.life > 0);
        for (const p of particles) {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // floating score text
        for (const fl of floats) { fl.y -= 0.8 * dt; fl.life -= 0.02 * dt; }
        floats = floats.filter(fl => fl.life > 0);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (const fl of floats) {
            ctx.globalAlpha = Math.max(0, fl.life);
            ctx.fillStyle = fl.color;
            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.fillText(fl.text, fl.x, fl.y);
        }
        ctx.globalAlpha = 1;

        drawBlade();
        animFrameId = requestAnimationFrame(draw);
    }

    // ─── Flow ──────────────────────────────────────────────────────────────────────
    function clearTimers() {
        if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
        if (phaseTimeout) { clearTimeout(phaseTimeout); phaseTimeout = null; }
        if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = 0; }
    }

    function setMode(mode) {
        gameMode = mode;
        maxLevels = LEVEL_CONFIG[mode].length;
        maxLevelDisplayEl.textContent = maxLevels;
    }

    function startCampaign() {
        score = 0; currentLevel = 1;
        results = {};
        scoreDisplayEl.textContent = '0';
        overlay.classList.add('hidden');
        titleEl.style.display = 'none';
        resize();
        if (!animFrameId) { lastTime = performance.now(); animFrameId = requestAnimationFrame(draw); }
        startLevel(1);
    }

    function startLevel(level) {
        clearTimers();
        currentLevel = level;
        scoreAtLevelStart = score;
        levelDisplayEl.textContent = level;
        fruits = []; particles = []; floats = [];
        phase = 'playing';
        timeLeft = LEVEL_TIME;
        timerEl.textContent = timeLeft;
        spawnTimer = 0;
        const cfg = LEVEL_CONFIG[gameMode][level - 1];

        // spawner
        spawnTimer = setInterval(() => { if (phase === 'playing') spawnFruit(); }, cfg.spawnMs);

        // countdown
        countdownInterval = setInterval(() => {
            timeLeft = Math.max(0, timeLeft - 1);
            timerEl.textContent = Math.ceil(timeLeft);
            if (timeLeft === 3) addFloat(canvas.width / 2, canvas.height * 0.3, '⌛ Koniec czasu!', '#cbd5e1');
            if (timeLeft <= 0) {
                clearInterval(countdownInterval); countdownInterval = null;
                clearInterval(spawnTimer);
                startBonus();
            }
        }, 1000);
    }

    function startBonus() {
        clearTimers();
        phase = 'bonus';
        fruits = [];
        bonusCombo = 0; lastBonusSlice = 0;
        bonusActiveAt = performance.now() + 1000;          // 1 s na przygotowanie zanim można ciąć
        bigBall = { x: canvas.width/2, y: canvas.height/2, r: Math.min(canvas.width, canvas.height)*0.2, pop: 0 };
        // brief banner then live
        showBanner('🎁 PREMIA! Tnij dużą kulkę ile się da!');
        let left = BONUS_TIME;
        timerEl.textContent = left;
        countdownInterval = setInterval(() => {
            left -= 1;
            timerEl.textContent = Math.max(0, left);
            if (left <= 0) {
                clearInterval(countdownInterval); countdownInterval = null;
                bigBall = null;
                results[currentLevel] = score - scoreAtLevelStart;   // punkty za ten poziom (z premią)
                if (currentLevel < maxLevels) {
                    getReady(currentLevel + 1);
                } else {
                    endGame();
                }
            }
        }, 1000);
    }

    // transient banner drawn over the canvas via a floating text
    function showBanner(text) {
        floats.push({ x: canvas.width/2, y: 38, text, color: '#fbbf24', life: 1.6, big: true });
    }

    function getReady(level) {
        clearTimers();
        phase = 'ready';
        addFloat(canvas.width/2, canvas.height/2, 'Poziom ' + level, '#93c5fd');
        phaseTimeout = setTimeout(() => startLevel(level), 1100);
    }

    function endGame() {
        clearTimers();
        phase = 'end';
        fruits = []; bigBall = null;
        overlayContent.classList.remove('hidden');
        recordsView.classList.add('hidden');
        titleEl.style.display = '';
        overlayTitle.textContent = 'Koniec! 🏆';
        modeSelection.classList.add('hidden');
        mainBtn.classList.remove('hidden');
        mainBtn.textContent = 'Zagraj ponownie';
        overlayDesc.textContent = '';
        let rows = '', total = 0;
        for (let lvl = 1; lvl <= maxLevels; lvl++) {
            if (results[lvl] !== undefined) { rows += `<p>Poziom ${lvl}: <span class="text-green-400 font-bold">${results[lvl]}</span> pkt</p>`; total += results[lvl]; }
        }
        overlayStats.innerHTML = rows +
            `<p class="mt-1 border-t border-gray-600 pt-1">Łącznie: <span class="text-green-400 font-bold">${total}</span> pkt · Rekord: <span class="text-yellow-400 font-bold">${bestTotal(gameMode)}</span></p>`;
        overlayStats.classList.remove('hidden');
        // sekcja zapisu wyniku (jak w unik)
        recordsSaved = false;
        saveSection.classList.remove('hidden');
        showRecordsStartBtn.classList.add('hidden');
        saveInfo.classList.add('hidden');
        playerNameInput.value = localStorage.getItem(NAME_KEY) || '';
        saveRecordBtn.disabled = false;
        saveRecordBtn.classList.replace('bg-gray-600', 'bg-green-600');
        overlay.classList.remove('hidden');
    }

    function showStartScreen() {
        clearTimers();
        phase = 'menu';
        fruits = []; particles = []; floats = []; bigBall = null;
        titleEl.style.display = '';
        overlayContent.classList.remove('hidden');
        recordsView.classList.add('hidden');
        overlayTitle.textContent = 'Wybierz tryb gry!';
        overlayStats.innerHTML =
            `<p class="text-center text-base">🏆 Rekordy — Dziecko: <span class="text-yellow-400 font-bold">${bestTotal('child')}</span> · Dorosły: <span class="text-yellow-400 font-bold">${bestTotal('adult')}</span> pkt</p>`;
        overlayStats.classList.remove('hidden');
        overlayDesc.textContent = 'Przecinaj spadające kulki palcem lub myszką! Kilka jednym ruchem = premia. Uważaj na bomby 💣 (-3s).';
        modeSelection.classList.remove('hidden');
        mainBtn.classList.add('hidden');
        saveSection.classList.add('hidden');
        showRecordsStartBtn.classList.remove('hidden');
        overlay.classList.remove('hidden');
    }

    btnChild.addEventListener('click', () => { setMode('child'); startCampaign(); });
    btnAdult.addEventListener('click', () => { setMode('adult'); startCampaign(); });
    mainBtn.addEventListener('click', showStartScreen);

    // init
    setMode('adult');
    showStartScreen();
    lastTime = performance.now();
    animFrameId = requestAnimationFrame(draw);
</script>
  <script src="../../shared/auth.js"></script>
</body>
</html>
