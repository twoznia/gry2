<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neonowy Wąż - Retro Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center justify-between min-h-screen text-slate-100 p-3 overflow-hidden select-none">

    <a class="back-link" href="../">← Wróć</a>

    <!-- Nagłówek i Wyniki -->
    <header class="w-full max-w-md flex flex-col items-center gap-1 mt-2 z-10">
        <h1 class="text-3xl md:text-4xl font-black tracking-widest font-orbitron text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 drop-shadow-sm neon-text-green">
            NEON SNAKE
        </h1>
        
        <div class="grid grid-cols-2 gap-4 w-full bg-slate-900/80 border border-slate-800 rounded-2xl p-3 backdrop-blur-md">
            <div class="flex flex-col items-center">
                <span class="text-xs uppercase tracking-widest text-slate-400">Wynik</span>
                <span id="score" class="text-2xl font-bold font-orbitron text-emerald-400">0</span>
            </div>
            <div class="flex flex-col items-center border-l border-slate-800">
                <span class="text-xs uppercase tracking-widest text-slate-400">Najlepszy</span>
                <span id="high-score" class="text-2xl font-bold font-orbitron text-cyan-400">0</span>
            </div>
        </div>
    </header>

    <!-- Obszar Gry -->
    <main class="relative w-full max-w-md aspect-square my-2 flex items-center justify-center">
        <!-- Canvas Gry -->
        <canvas id="game-canvas" class="bg-slate-950 border-2 border-emerald-500 rounded-2xl neon-border w-full h-full max-w-full max-h-full aspect-square"></canvas>

        <!-- Ekran Startowy / Menu -->
        <div id="start-screen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-20 border border-emerald-500/30">
            <i class="fa-solid fa-gamepad text-5xl text-emerald-400 mb-3 animate-pulse"></i>
            <h2 class="text-2xl font-bold font-orbitron mb-4 text-emerald-300">WYBIERZ USTAWIENIA</h2>
            
            <!-- Trudność -->
            <div class="w-full mb-4">
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Trudność (Prędkość)</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setDifficulty('easy')" id="diff-easy" class="btn-glow py-2 px-3 rounded-lg text-sm font-semibold bg-slate-800 border border-slate-700 hover:border-emerald-500 text-slate-300">Łatwy</button>
                    <button onclick="setDifficulty('medium')" id="diff-medium" class="btn-glow py-2 px-3 rounded-lg text-sm font-semibold bg-emerald-500/20 border-2 border-emerald-500 text-emerald-400">Średni</button>
                    <button onclick="setDifficulty('hard')" id="diff-hard" class="btn-glow py-2 px-3 rounded-lg text-sm font-semibold bg-slate-800 border border-slate-700 hover:border-emerald-500 text-slate-300">Trudny</button>
                </div>
            </div>

            <!-- Skórka Węża -->
            <div class="w-full mb-6">
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Wygląd Węża</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setSkin('classic')" id="skin-classic" class="btn-glow p-2 rounded-lg bg-emerald-500/20 border-2 border-emerald-500 flex flex-col items-center justify-center gap-1">
                        <span class="w-4 h-4 rounded bg-emerald-400 block"></span>
                        <span class="text-[10px]">Neon</span>
                    </button>
                    <button onclick="setSkin('cyberpunk')" id="skin-cyberpunk" class="btn-glow p-2 rounded-lg bg-slate-800 border border-slate-700 hover:border-pink-500 flex flex-col items-center justify-center gap-1">
                        <span class="w-4 h-4 rounded bg-rose-500 block"></span>
                        <span class="text-[10px]">Cyber</span>
                    </button>
                    <button onclick="setSkin('aqua')" id="skin-aqua" class="btn-glow p-2 rounded-lg bg-slate-800 border border-slate-700 hover:border-cyan-500 flex flex-col items-center justify-center gap-1">
                        <span class="w-4 h-4 rounded bg-cyan-400 block"></span>
                        <span class="text-[10px]">Aqua</span>
                    </button>
                    <button onclick="setSkin('gold')" id="skin-gold" class="btn-glow p-2 rounded-lg bg-slate-800 border border-slate-700 hover:border-amber-400 flex flex-col items-center justify-center gap-1">
                        <span class="w-4 h-4 rounded bg-amber-400 block"></span>
                        <span class="text-[10px]">Złoto</span>
                    </button>
                </div>
            </div>

            <button onclick="startGame()" class="btn-glow w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 py-3 rounded-xl font-bold font-orbitron text-lg tracking-wider hover:opacity-90 neon-shadow">
                URUCHOM GRĘ
            </button>
        </div>

        <!-- Ekran Pauzy / Koniec Gry -->
        <div id="overlay-screen" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center z-20 hidden border border-slate-800">
            <h2 id="overlay-title" class="text-3xl font-black font-orbitron mb-2 text-rose-500 neon-text-pink">GRA SKOŃCZONA</h2>
            <p id="overlay-msg" class="text-slate-400 text-sm mb-6">Uderzyłeś w ścianę lub we własny ogon!</p>
            
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 w-full max-w-[280px] mb-6 grid grid-cols-2 gap-2">
                <div>
                    <span class="text-[11px] text-slate-400 block">TWÓJ WYNIK</span>
                    <span id="overlay-score" class="text-2xl font-bold font-orbitron text-slate-100">0</span>
                </div>
                <div class="border-l border-slate-800">
                    <span class="text-[11px] text-slate-400 block">NAJLEPSZY WYNIK</span>
                    <span id="overlay-high" class="text-2xl font-bold font-orbitron text-emerald-400">0</span>
                </div>
            </div>

            <div class="flex flex-col gap-2 w-full max-w-[280px]">
                <button onclick="startGame()" class="btn-glow bg-emerald-500 text-slate-950 py-3 rounded-xl font-bold font-orbitron tracking-wide hover:bg-emerald-400">
                    ZAGRAJ PONOWNIE
                </button>
                <button onclick="showMainMenu()" class="btn-glow bg-slate-800 border border-slate-700 py-3 rounded-xl font-bold font-orbitron tracking-wide hover:bg-slate-700">
                    MENU GŁÓWNE
                </button>
            </div>
        </div>
    </main>

    <!-- Panel Sterowania Dolny (D-Pad dla urządzeń mobilnych oraz przyciski menu) -->
    <footer class="w-full max-w-md flex flex-col gap-3 mb-1">
        
        <!-- Pasek Kontroli i Info -->
        <div class="flex justify-between items-center bg-slate-900/50 border border-slate-800/80 rounded-xl p-2 px-3 text-xs">
            <div class="flex gap-4">
                <button onclick="toggleMute()" class="text-slate-400 hover:text-emerald-400 transition-colors">
                    <i id="mute-icon" class="fa-solid fa-volume-xmark text-sm text-rose-500"></i> <span class="hidden sm:inline">Dźwięk</span>
                </button>
                <button onclick="togglePause()" class="text-slate-400 hover:text-emerald-400 transition-colors">
                    <i id="pause-icon" class="fa-solid fa-pause text-sm"></i> <span id="pause-text" class="hidden sm:inline">Pauza (Space)</span>
                </button>
            </div>
            <div class="text-slate-500 text-[10px] sm:text-xs">
                Sterowanie: <i class="fa-solid fa-arrow-up-long"></i> lub gest / D-Pad
            </div>
        </div>

        <!-- Wirtualny Kontroler (D-Pad) dla Mobilnych -->
        <div id="mobile-controls" class="flex flex-col items-center justify-center p-2 select-none md:hidden">
            <div class="relative w-40 h-40 bg-slate-900/60 rounded-full border border-slate-800 flex items-center justify-center shadow-inner">

                <!-- GÓRA -->
                <button onclick="changeDirectionMobile('UP')" class="absolute top-1 w-14 h-12 bg-slate-800/80 active:bg-emerald-500/30 active:text-emerald-400 rounded-t-full flex items-center justify-center text-slate-400 transition-colors border-t border-slate-700" style="touch-action:manipulation;-webkit-tap-highlight-color:transparent">
                    <i class="fa-solid fa-caret-up text-xl"></i>
                </button>

                <!-- DÓŁ -->
                <button onclick="changeDirectionMobile('DOWN')" class="absolute bottom-1 w-14 h-12 bg-slate-800/80 active:bg-emerald-500/30 active:text-emerald-400 rounded-b-full flex items-center justify-center text-slate-400 transition-colors border-b border-slate-700" style="touch-action:manipulation;-webkit-tap-highlight-color:transparent">
                    <i class="fa-solid fa-caret-down text-xl"></i>
                </button>

                <!-- LEWO -->
                <button onclick="changeDirectionMobile('LEFT')" class="absolute left-1 h-14 w-12 bg-slate-800/80 active:bg-emerald-500/30 active:text-emerald-400 rounded-l-full flex items-center justify-center text-slate-400 transition-colors border-l border-slate-700" style="touch-action:manipulation;-webkit-tap-highlight-color:transparent">
                    <i class="fa-solid fa-caret-left text-xl"></i>
                </button>

                <!-- PRAWO -->
                <button onclick="changeDirectionMobile('RIGHT')" class="absolute right-1 h-14 w-12 bg-slate-800/80 active:bg-emerald-500/30 active:text-emerald-400 rounded-r-full flex items-center justify-center text-slate-400 transition-colors border-r border-slate-700" style="touch-action:manipulation;-webkit-tap-highlight-color:transparent">
                    <i class="fa-solid fa-caret-right text-xl"></i>
                </button>

                <!-- Środek -->
                <div class="w-10 h-10 rounded-full bg-slate-950 border border-slate-800/60 shadow"></div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
  <script src="../shared/auth.js"></script>
</body>
</html>
