<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahjong Solitaire - Medieval</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="back-link" href="../">← Wróć</a>

    <div id="game-container">
        <header class="w-full max-w-5xl flex flex-col md:flex-row justify-between items-center bg-slate-800 px-3 py-1.5 rounded-xl shadow-lg border border-slate-700 mb-1 z-20 relative gap-1.5">
            <div class="text-center md:text-left flex items-baseline gap-3 md:flex-col md:gap-0.5">
                <h1 id="style-title" class="text-lg md:text-xl font-bold medieval-font tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-amber-600 leading-none">Mahjong</h1>
                <p class="text-slate-400 text-xs whitespace-nowrap" id="tiles-left-display">Klocki: <span id="tiles-count" class="font-bold text-white">144</span> · Czas: <span id="timer-display" class="font-bold text-white">00:00</span></p>
            </div>
            
            <div class="menu-layout">
                <div class="menu-row">
                <label class="control-label">
                    <span class="text-xs uppercase tracking-wider text-slate-400">Styl</span>
                    <select id="style-select" class="style-select"></select>
                </label>
                <label class="control-label">
                    <span class="text-xs uppercase tracking-wider text-slate-400">Rozmiar</span>
                    <div class="zoom-controls">
                        <button id="zoom-out" type="button" class="zoom-btn" aria-label="Pomniejsz">-</button>
                        <button id="zoom-reset" type="button" class="zoom-value">110%</button>
                        <button id="zoom-in" type="button" class="zoom-btn" aria-label="Powiększ">+</button>
                    </div>
                </label>
                <button onclick="startGame()" class="menu-action-btn bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500">
                    Nowa Gra
                </button>
                <button id="show-scores-btn" type="button" class="menu-action-btn bg-gradient-to-r from-slate-700 to-slate-600 hover:from-slate-600 hover:to-slate-500">
                    Wyniki
                </button>
                </div>

                <div class="menu-row">
                    <div class="hint-actions">
                        <button id="hint-toggle" type="button" class="hint-action-btn">Podświetlenie</button>
                        <button id="show-move-btn" type="button" class="hint-action-btn">Pokaż ruch</button>
                        <button id="undo-btn" type="button" class="hint-action-btn" disabled>Cofnij</button>
                    </div>
                <button onclick="shuffleRemaining()" id="btn-shuffle" class="menu-action-btn bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500">
                    Przetasuj
                </button>
                </div>
            </div>
        </header>

        <div id="board-wrapper">
            <div id="board"></div>
        </div>
    </div>

    <div id="message-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-800 border-2 border-amber-500 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center transform scale-95 transition-transform duration-300" id="modal-content">
            <h2 id="modal-title" class="text-4xl medieval-font font-bold text-yellow-400 mb-4">Koniec Gry</h2>
            <p id="modal-message" class="text-slate-300 text-lg mb-8">Brak dostępnych ruchów.</p>
            <div class="flex justify-center gap-4">
                <button onclick="closeModal(); shuffleRemaining();" id="modal-btn-shuffle" class="px-6 py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-xl shadow transition-colors hidden">Przetasuj klocki</button>
                <button onclick="closeModal(); startGame();" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition-colors">Zagraj ponownie</button>
            </div>
        </div>
    </div>

    <div id="leaderboard-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-800 border-2 border-sky-500 p-8 rounded-2xl shadow-2xl max-w-2xl w-full text-center transform scale-95 transition-transform duration-300" id="leaderboard-content">
            <h2 id="leaderboard-title" class="text-4xl medieval-font font-bold text-sky-300 mb-3">Najlepsze wyniki</h2>
            <p id="leaderboard-message" class="text-slate-300 text-lg">Top 10 wyników</p>
            <div id="leaderboard-list" class="results-list"></div>
            <p id="leaderboard-empty" class="results-empty hidden">Brak zapisanych wyników.</p>
            <div class="flex justify-center gap-4 mt-8">
                <button id="leaderboard-reset-btn" type="button" class="px-6 py-3 bg-red-800 hover:bg-red-700 text-white font-bold rounded-xl shadow transition-colors">Wyczyść wyniki</button>
                <button id="leaderboard-close-btn" type="button" class="px-6 py-3 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-xl shadow transition-colors">Zamknij</button>
                <button id="leaderboard-restart-btn" type="button" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition-colors">Nowa gra</button>
            </div>
        </div>
    </div>

    <div id="name-entry-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-800 border-2 border-emerald-500 p-8 rounded-2xl shadow-2xl max-w-md w-full text-center transform scale-95 transition-transform duration-300">
            <h2 class="text-4xl medieval-font font-bold text-emerald-300 mb-3">Zapisz wynik</h2>
            <p id="name-entry-message" class="text-slate-300 text-lg mb-6">Podaj imię do rankingu.</p>
            <input id="name-entry-input" type="text" maxlength="24" class="w-full px-4 py-3 rounded-xl border border-slate-600 bg-slate-900 text-slate-100 font-bold text-center outline-none focus:border-emerald-400" placeholder="Gracz">
            <div class="flex justify-center gap-4 mt-8">
                <button id="name-entry-skip-btn" type="button" class="px-6 py-3 bg-slate-600 hover:bg-slate-500 text-white font-bold rounded-xl shadow transition-colors">Pomiń</button>
                <button id="name-entry-save-btn" type="button" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow transition-colors">Zapisz</button>
            </div>
        </div>
    </div>

    <script src="styles-manifest.js"></script>
    <script src="script.js"></script>
  <script src="../shared/auth.js"></script>
</body>
</html>
